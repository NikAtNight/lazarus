<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>lazarus</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17392b"/>
      <stop offset="1" stop-color="#0b2018"/>
    </linearGradient>
    <!-- cuts a clean gap where the main canopy overlaps the two copies -->
    <mask id="gap">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="172" r="86" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- trunks: a main line with two branches forking off it, git-graph style -->
  <g fill="none" stroke="#e9f3ec" stroke-width="22" stroke-linecap="round">
    <path d="M256 392 V 236"/>
    <path d="M256 372 C 256 328, 152 340, 152 292"/>
    <path d="M256 330 C 256 290, 360 302, 360 260"/>
  </g>

  <!-- canopies: two worktrees, each a copy of the main tree -->
  <g mask="url(#gap)" fill="#56c285">
    <circle cx="152" cy="252" r="58"/>
    <circle cx="360" cy="226" r="58"/>
  </g>
  <circle cx="256" cy="172" r="74" fill="#8fe7af"/>

  <!-- root commit: the main checkout -->
  <circle cx="256" cy="416" r="26" fill="#e9f3ec"/>
  <circle cx="256" cy="416" r="11" fill="#0d241b"/>
</svg>
